<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คลังคลิปน่าดู</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f; --panel: #1c1c1c; --panel-2: #272727; --text: #f1f1f1; --muted: #aaa;
  --line: #2f2f2f; --accent: #ff4e45; --hi: #1e8e3e; --mid: #c77700; --lo: #b3261e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Anuphan', sans-serif; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 28px 24px 60px; }
header h1 { font-size: 30px; margin: 0; letter-spacing: -.3px; }
header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
header b { color: var(--text); font-weight: 600; }
.bar { display: grid; grid-template-columns: 1fr 220px 220px; gap: 12px; margin: 22px 0 12px; }
input, select { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 14px; font: inherit; font-size: 14px; outline: none; }
input:focus, select:focus { border-color: #555; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chip { background: var(--panel-2); border: 1px solid transparent; color: var(--text); border-radius: 999px;
  padding: 6px 14px; font: inherit; font-size: 13.5px; cursor: pointer; transition: background .15s; }
.chip:hover { background: #333; }
.chip.on { background: var(--text); color: #0f0f0f; }
.count { color: var(--muted); font-size: 13px; margin: 14px 0 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 34px 20px; }
.thumb { position: relative; display: block; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden;
  background: #222; transition: border-radius .2s; }
.thumb:hover { border-radius: 4px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; color: #fff; font-size: 12.5px; font-weight: 600; padding: 2px 7px;
  border-radius: 6px; background: rgba(0,0,0,.82); }
.b-rank { left: 8px; top: 8px; } .b-dur { right: 8px; bottom: 8px; } .b-score { right: 8px; top: 8px; }
.s-hi { background: var(--hi); } .s-mid { background: var(--mid); } .s-lo { background: var(--lo); }
.title { font-size: 15.5px; font-weight: 600; line-height: 1.4; margin: 12px 0 4px; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.title a:hover, .meta a:hover { text-decoration: underline; }
.meta { font-size: 13px; color: var(--muted); line-height: 1.55; }
.meta .ch { color: #ddd; }
details { background: #181818; border-radius: 10px; margin-top: 10px; font-size: 13.5px; }
summary { cursor: pointer; padding: 9px 12px; list-style: none; user-select: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "›"; display: inline-block; margin-right: 8px; transition: transform .15s; }
details[open] summary::before { transform: rotate(90deg); }
.why { padding: 0 14px 10px; line-height: 1.6; }
.why p { margin: 6px 0; } .why ul { margin: 6px 0; padding-left: 18px; } .why li { margin: 3px 0; }
.why .reasons { color: var(--muted); font-size: 12.5px; }
.ep { padding: 7px 14px; border-top: 1px solid var(--line); line-height: 1.5; }
.ep a:hover { text-decoration: underline; } .ep span { color: var(--muted); font-size: 12.5px; }
.ep .here { color: var(--accent); font-size: 12px; margin-left: 4px; }
.status { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10px; border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; }
.status button { background: transparent; color: var(--text); border: 0; border-right: 1px solid var(--line);
  padding: 8px 4px; font: inherit; font-size: 13px; cursor: pointer; }
.status button:last-child { border-right: 0; }
.status button:hover { background: #222; }
.status button.on { background: #3a1513; color: #ff8a80; box-shadow: inset 0 0 0 1px var(--accent); }
.empty { color: var(--muted); padding: 40px 0; }
footer { margin-top: 48px; color: #777; font-size: 12.5px; line-height: 1.6; }
@media (max-width: 760px) {
  .wrap { padding: 20px 16px 48px; }
  .bar { grid-template-columns: 1fr 1fr; } .bar input { grid-column: 1 / -1; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>▶️ คลังคลิปน่าดู</h1>
    <p id="sub"></p>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="🔍  ค้นหาชื่อคลิป" aria-label="ค้นหาชื่อคลิป">
    <select id="s1" aria-label="เรียงตาม"></select>
    <select id="s2" aria-label="แล้วตาม"></select>
  </div>
  <div class="chips" id="statusChips" aria-label="กรองตามสถานะ"></div>
  <div class="chips" id="channelChips" aria-label="กรองตามช่อง"></div>
  <div class="chips"><button type="button" class="chip" id="setToken">☁️ ตั้งค่าซิงก์อัตโนมัติ</button><button type="button" class="chip" id="copyLink">🔗 คัดลอกลิงก์ส่วนตัวสำหรับเครื่องอื่น</button><span id="syncMsg" role="status"></span></div>
  <div class="count" id="count"></div>
  <main class="grid" id="grid"></main>
  <footer>
    คะแนนและเหตุผลสรุปโดย Claude จากคอมเมนต์ของผู้ชม · สถานะ ดูแล้ว / สนใจ / ไม่สนใจ บันทึกไว้ในเบราว์เซอร์นี้ ซิงก์ข้ามเครื่องอัตโนมัติเมื่อเปิดซิงก์<br>
    ข้อมูลจาก YouTube Data API · <span id="gen"></span>
  </footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const STATUS = { watched: "✅ ดูแล้ว", interested: "⭐ สนใจ", not_interested: "🚫 ไม่สนใจ" };
const STATUS_FILTER = { none: "ยังไม่เลือก", interested: "⭐ สนใจ", watched: "✅ ดูแล้ว", not_interested: "🚫 ไม่สนใจ" };
const SORTS = {
  rank: ["อันดับของ Claude", v => v.rank ?? 1e9, 1],
  views: ["ยอดวิวมากสุด", v => v.views ?? -1, -1],
  vpd: ["วิวต่อวันมากสุด", v => v.vpd, -1],
  likes: ["ไลก์มากสุด", v => v.likes ?? -1, -1],
  comments: ["คอมเมนต์มากสุด", v => v.comments ?? -1, -1],
  pub: ["ใหม่ล่าสุด", v => v.pubTs, -1],
  dur: ["ยาวที่สุด", v => v.dur, -1],
};
const KEY = "yt-library-status-v1";

const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  set(map) { try { localStorage.setItem(KEY, JSON.stringify(map)); } catch {} },
};
const CODE = { watched: "w", interested: "i", not_interested: "n" };
const DECODE = { w: "watched", i: "interested", n: "not_interested" };
// เครื่องที่ยังไม่เคยกดอะไร เริ่มจากสถานะตั้งต้นที่ฝังมากับหน้าเว็บ (ส่งออกจาก DB ตอน build)
const hasSaved = (() => { try { return localStorage.getItem(KEY) !== null; } catch { return true; } })();
let statusMap = hasSaved ? store.get() : { ...(DATA.baseline || {}) };
function syncMsg(t) { const m = document.getElementById("syncMsg"); m.textContent = t; setTimeout(() => { m.textContent = ""; }, 6000); }
// ลิงก์ที่ติดสถานะมา (#s=id.w~id.i) = สถานะล่าสุดจากอีกเครื่อง แทนที่ของเครื่องนี้ทั้งหมด
const fromHash = new URLSearchParams(location.hash.slice(1)).get("s");
if (fromHash !== null) {
  const m = {};
  for (const p of fromHash.split("~")) { const [id, c] = p.split("."); if (id && DECODE[c]) m[id] = DECODE[c]; }
  statusMap = m; store.set(statusMap);
  history.replaceState(null, "", location.pathname + location.search);
  setTimeout(() => syncMsg(`นำเข้าสถานะจากลิงก์ ${Object.keys(m).length} คลิปแล้ว`), 0);
}
document.getElementById("copyLink").onclick = async () => {
  const key = (() => { try { return localStorage.getItem("yt-library-sync-key"); } catch { return null; } })();
  const enc = Object.entries(statusMap).filter(([, k]) => CODE[k]).map(([id, k]) => `${id}.${CODE[k]}`).join("~");
  const base = location.origin + location.pathname + location.search;
  const url = key ? base + "#k=" + key : base + "#s=" + enc;   // มีรหัสซิงก์ = ลิงก์เปิดซิงก์ให้เครื่องอื่น · ไม่มี = ลิงก์ย้ายสถานะครั้งเดียว
  try { await navigator.clipboard.writeText(url); syncMsg(key ? "คัดลอกลิงก์ส่วนตัวแล้ว (อย่าแชร์ให้คนอื่น) เปิดในเครื่องอื่นครั้งเดียวก็ซิงก์อัตโนมัติ" : "คัดลอกลิงก์แล้ว เปิดลิงก์นี้ในเครื่องอื่นได้เลย"); }
  catch { prompt("คัดลอกลิงก์นี้ไปเปิดในเครื่องอื่น", url); }
};
// ---- ซิงก์สถานะข้ามเครื่องอัตโนมัติ: เก็บในระบบหลังบ้านของเจ้าของเว็บเอง (Cloudflare Worker + KV ฟรี)
// อ่านได้ทุกเครื่องโดยไม่ต้องตั้งค่า · เขียนต้องมี "รหัสซิงก์" ซึ่งใส่ครั้งเดียวต่อเครื่องด้วยการเปิดลิงก์ส่วนตัว (#k=รหัส)
const SYNC = { url: "https://yt-library-status.ytlib-765e3f.workers.dev/status" };
const TS_KEY = "yt-library-status-ts-v1", SYNC_KEY = "yt-library-sync-key";
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const hashParams = new URLSearchParams(location.hash.slice(1));
if (hashParams.get("k")) {            // เปิดลิงก์ส่วนตัวครั้งแรกบนเครื่องนี้ -> จำรหัสไว้แล้วลบออกจากแถบที่อยู่
  ls.set(SYNC_KEY, hashParams.get("k").trim());
  hashParams.delete("k");
  const rest = hashParams.toString();
  history.replaceState(null, "", location.pathname + location.search + (rest ? "#" + rest : ""));
  setTimeout(() => syncMsg("เปิดซิงก์อัตโนมัติบนเครื่องนี้แล้ว"), 0);
}
let tsMap = (() => { try { return JSON.parse(ls.get(TS_KEY)) || {}; } catch { return {}; } })();
let pushTimer = null, syncing = false;
function saveTs() { ls.set(TS_KEY, JSON.stringify(tsMap)); }
function touch(id) { tsMap[id] = Date.now(); saveTs(); schedulePush(); }
function syncOn() { return !!ls.get(SYNC_KEY); }
function renderSyncBtn() { document.getElementById("setToken").textContent = syncOn() ? "☁️ ซิงก์อัตโนมัติ: เปิดอยู่" : "☁️ ซิงก์อัตโนมัติ: ยังไม่เปิดในเครื่องนี้"; }
async function fetchRemote() {
  const r = await fetch(SYNC.url + "?_=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("อ่านไม่ได้ (" + r.status + ")");
  return (await r.json()).items || {};
}
// รวมต่อคลิป: เวลาที่กดล่าสุดชนะ · เวลาเท่ากัน (เช่น ค่าตั้งต้นที่ไม่มีเวลา) ให้ยึดค่าในเครื่องที่มีสถานะอยู่
function mergeRemote(items) {
  let changed = false, differs = false;
  const ids = new Set([...Object.keys(statusMap), ...Object.keys(tsMap), ...Object.keys(items)]);
  for (const id of ids) {
    const l = { s: statusMap[id] ?? null, t: tsMap[id] || 0 };
    const r = items[id] ? { s: items[id].s ?? null, t: items[id].t || 0 } : null;
    if (r && (r.t > l.t || (r.t === l.t && l.s === null))) {
      if (r.s !== l.s) { r.s ? statusMap[id] = r.s : delete statusMap[id]; changed = true; }
      if (r.t) tsMap[id] = r.t;
    } else if (l.s !== null || l.t > 0) {
      if (!r || r.s !== l.s || r.t !== l.t) differs = true;
    }
  }
  return { changed, differs };
}
async function pull() {
  try {
    const { changed, differs } = mergeRemote(await fetchRemote());
    store.set(statusMap); saveTs();
    if (changed) render();
    if (differs) schedulePush(); else if (syncOn()) syncMsg("☁️ ซิงก์แล้ว");
  } catch (e) { syncMsg("ซิงก์ไม่ได้ ใช้ค่าในเครื่องนี้ไปก่อน (" + e.message + ")"); }
}
function schedulePush() {
  if (!syncOn()) { syncMsg("บันทึกในเครื่องนี้แล้ว · เครื่องนี้ยังไม่ได้เปิดซิงก์ เครื่องอื่นจึงยังไม่เห็น"); return; }
  clearTimeout(pushTimer); pushTimer = setTimeout(push, 1000);
}
async function push() {
  if (syncing) { clearTimeout(pushTimer); pushTimer = setTimeout(push, 800); return; }
  syncing = true;
  try {
    const out = {};
    for (const id of new Set([...Object.keys(statusMap), ...Object.keys(tsMap)])) {
      if (statusMap[id] || tsMap[id]) out[id] = { s: statusMap[id] ?? null, t: tsMap[id] || 1 };
    }
    const r = await fetch(SYNC.url, { method: "PUT", headers: { "Content-Type": "application/json", Authorization: "Bearer " + ls.get(SYNC_KEY) },
      body: JSON.stringify({ items: out }) });
    if (r.status === 401) throw new Error("รหัสซิงก์ไม่ถูกต้อง เปิดลิงก์ส่วนตัวใหม่อีกครั้ง");
    if (!r.ok) throw new Error("เขียนไม่ได้ (" + r.status + ")");
    for (const id of Object.keys(out)) if (!tsMap[id]) tsMap[id] = 1;
    const { changed } = mergeRemote((await r.json()).items || {});   // เซิร์ฟเวอร์รวมให้แล้ว: รับของเครื่องอื่นที่ใหม่กว่ากลับมา
    store.set(statusMap); saveTs(); if (changed) render();
    syncMsg("☁️ ซิงก์แล้ว");
  } catch (e) { syncMsg("ซิงก์ไม่สำเร็จ: " + e.message); }
  syncing = false;
}
document.getElementById("setToken").onclick = () => {
  const t = prompt("วางรหัสซิงก์ (หรือเปิดลิงก์ส่วนตัวแทนก็ได้)\nเว้นว่างแล้วกดตกลง = ปิดซิงก์บนเครื่องนี้" );
  if (t === null) return;
  if (t.trim()) { ls.set(SYNC_KEY, t.trim()); renderSyncBtn(); syncMsg("เปิดซิงก์แล้ว กำลังซิงก์…"); push(); }
  else { ls.del(SYNC_KEY); renderSyncBtn(); syncMsg("ปิดซิงก์บนเครื่องนี้แล้ว"); }
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
renderSyncBtn();
setTimeout(pull, 0);

const state = { q: "", s1: "rank", s2: "", statuses: new Set(["none", "interested", "watched"]), channels: new Set() };

const now = Date.now();
for (const v of DATA.videos) {
  v.pubTs = Date.parse(v.pub);
  v.vpd = (v.views ?? 0) / Math.max(1, (now - v.pubTs) / 864e5);
}
const byId = Object.fromEntries(DATA.videos.map(v => [v.id, v]));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function shortNum(n) {
  if (n == null) return "–";
  for (const [d, s] of [[1e9, "B"], [1e6, "M"], [1e3, "K"]]) {
    if (n >= d) { const x = n / d; return (x < 10 ? x.toFixed(1).replace(/\.0$/, "") : Math.floor(x)) + s; }
  }
  return String(n);
}
function timeAgo(ts) {
  const s = (now - ts) / 1000;
  for (const [u, z] of [["ปี", 31536000], ["เดือน", 2592000], ["สัปดาห์", 604800], ["วัน", 86400], ["ชั่วโมง", 3600], ["นาที", 60]]) {
    if (s >= z) return `${Math.floor(s / z)} ${u}ที่แล้ว`;
  }
  return "เมื่อสักครู่";
}
const scoreClass = s => s >= 75 ? "s-hi" : s >= 50 ? "s-mid" : "s-lo";

function chip(label, on, onClick) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : ""); b.textContent = label; b.type = "button";
  b.setAttribute("aria-pressed", on); b.onclick = onClick;
  return b;
}
function renderChips() {
  const sc = document.getElementById("statusChips"); sc.replaceChildren();
  for (const [k, label] of Object.entries(STATUS_FILTER)) {
    sc.append(chip(label, state.statuses.has(k), () => {
      state.statuses.has(k) ? state.statuses.delete(k) : state.statuses.add(k); renderChips(); render();
    }));
  }
  const cc = document.getElementById("channelChips"); cc.replaceChildren();
  const channels = [...new Set(DATA.videos.map(v => v.ch))].sort();
  if (channels.length < 2) return;
  for (const c of channels) {
    cc.append(chip(c, state.channels.has(c), () => {
      state.channels.has(c) ? state.channels.delete(c) : state.channels.add(c); renderChips(); render();
    }));
  }
}

function sorted(list) {
  const keys = [state.s1, state.s2].filter(Boolean).filter((k, i, a) => a.indexOf(k) === i);
  return [...list].sort((a, b) => {
    for (const k of keys) {
      const [, f, dir] = SORTS[k]; const d = (f(a) - f(b)) * dir;
      if (d) return d;
    }
    return (a.rank ?? 1e9) - (b.rank ?? 1e9);
  });
}

function card(v, episodes) {
  const st = statusMap[v.id];
  const url = `https://www.youtube.com/watch?v=${v.id}`;
  const el = document.createElement("article");
  el.innerHTML = `
    <a class="thumb" href="${url}" target="_blank" rel="noopener">
      <img src="${esc(v.thumb)}" alt="" loading="lazy">
      ${v.rank ? `<span class="badge b-rank">#${v.rank}</span>` : ""}
      ${v.score != null ? `<span class="badge b-score ${scoreClass(v.score)}">${Math.round(v.score)}</span>` : ""}
      <span class="badge b-dur">${v.durText}</span>
    </a>
    <div class="title"><a href="${url}" target="_blank" rel="noopener" title="${esc(v.title)}">${esc(v.title)}</a></div>
    <div class="meta"><a class="ch" href="${esc(v.chUrl)}" target="_blank" rel="noopener">${esc(v.ch)}</a><br>
      ยอดดู ${shortNum(v.views)} ครั้ง · ${timeAgo(v.pubTs)} · 👍 ${shortNum(v.likes)} · 💬 ${shortNum(v.comments)}</div>
    ${v.summary ? `<details><summary>ทำไมได้คะแนนนี้</summary><div class="why">${v.summary}
      ${v.reasons ? `<p class="reasons">${v.reasons}</p>` : ""}</div></details>` : ""}
    ${episodes ? `<details><summary>📚 เรื่องนี้มี ${episodes.length} คลิป (ภาคต่อ/ฉบับอื่น)</summary>
      ${episodes.map(e => `<div class="ep"><a href="https://www.youtube.com/watch?v=${e.id}" target="_blank" rel="noopener">${e.order}. ${esc(e.title)}</a>${e.id === v.id ? '<span class="here">◀ การ์ดนี้</span>' : ""}<br>
        <span>${esc(e.ch)} · ${e.durText} · ยอดดู ${shortNum(e.views)}${e.score != null ? ` · คะแนน <b>${Math.round(e.score)}</b>` : ""}${e.rank ? ` · อันดับ #${e.rank}` : ""}</span></div>`).join("")}
    </details>` : ""}
    <div class="status" role="group" aria-label="สถานะ">
      ${Object.entries(STATUS).map(([k, l]) => `<button type="button" data-k="${k}" class="${st === k ? "on" : ""}" aria-pressed="${st === k}">${l}</button>`).join("")}
    </div>`;
  el.querySelectorAll(".status button").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (statusMap[v.id] === k) delete statusMap[v.id]; else statusMap[v.id] = k;
    store.set(statusMap); touch(v.id);
    if (!state.statuses.has(statusMap[v.id] ?? "none")) render();
    else el.querySelectorAll(".status button").forEach(x => {
      const on = statusMap[v.id] === x.dataset.k; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on);
    });
  });
  return el;
}

function render() {
  const q = state.q.trim().toLowerCase();
  let list = DATA.videos.filter(v =>
    state.statuses.has(statusMap[v.id] ?? "none") &&
    (!state.channels.size || state.channels.has(v.ch)) &&
    (!q || v.title.toLowerCase().includes(q)));
  list = sorted(list);
  // one card per story: the best-placed clip in the current order; all clips behind a dropdown
  const groups = {};
  for (const v of DATA.videos) if (v.series) (groups[v.series] ??= []).push(v);
  for (const k in groups) groups[k].sort((a, b) => a.order - b.order);
  const seen = new Set();
  const cards = list.filter(v => {
    if (!v.series || groups[v.series].length < 2) return true;
    if (seen.has(v.series)) return false;
    seen.add(v.series); return true;
  });
  const grid = document.getElementById("grid"); grid.replaceChildren();
  document.getElementById("count").textContent = `แสดง ${cards.length} การ์ด (${list.length} คลิป) จากทั้งหมด ${DATA.videos.length} คลิป`;
  if (!cards.length) { grid.innerHTML = '<div class="empty">ไม่พบคลิปตามตัวกรองนี้</div>'; return; }
  for (const v of cards) grid.append(card(v, v.series && groups[v.series].length > 1 ? groups[v.series] : null));
}

(function init() {
  const nCh = new Set(DATA.videos.map(v => v.ch)).size;
  const scored = DATA.videos.filter(v => v.score != null).length;
  document.getElementById("sub").innerHTML =
    `คลิปยาวกว่า <b>10 ชั่วโมง</b> · ยอดวิว <b>50K+</b> (คลิปอายุไม่ถึง 2 เดือนใช้เกณฑ์ตามอายุ) · <b>${DATA.videos.length}</b> คลิป จาก <b>${nCh}</b> ช่อง · Claude ให้คะแนน <b>${scored}</b> คลิป`;
  document.getElementById("gen").textContent = "อัปเดต " + new Date(DATA.generatedAt).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
  const s1 = document.getElementById("s1"), s2 = document.getElementById("s2");
  for (const [k, [l]] of Object.entries(SORTS)) s1.add(new Option("เรียงตาม: " + l, k));
  s2.add(new Option("แล้วตาม: —", ""));
  for (const [k, [l]] of Object.entries(SORTS)) s2.add(new Option("แล้วตาม: " + l, k));
  s1.onchange = () => { state.s1 = s1.value; render(); };
  s2.onchange = () => { state.s2 = s2.value; render(); };
  document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
  renderChips(); render();
})();
</script>
